name: capture-android-demo
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download release APK v1.3.1
        run: |
          curl -fSL --retry 3 -o app.apk "https://github.com/abr429701-oss/coptic-dictionary-mobile/releases/download/v1.3.1/Coptic.Dictionary.1.3.1.apk"
          ls -la app.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and capture demo
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/capture-android-demo.sh

      - name: Upload capture artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-demo-capture
          path: capture/
          retention-days: 1